# needed for websocket Connection header
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name predixa.markets www.predixa.markets;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name predixa.markets www.predixa.markets;

    ssl_certificate     /etc/nginx/ssl/predixa_markets.crt;
    ssl_certificate_key       /etc/nginx/ssl/predixa_markets.key;

    ssl_trusted_certificate /etc/nginx/ssl/predixa_markets.ca-bundle;

    # optional but good:
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    root /usr/share/nginx/html;
    index index.html;


    location /firebase-messaging-sw.js {
        root /usr/share/nginx/html;
        default_type application/javascript;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # --- API routes (go to backend Nginx LB) ---
    location /api/ {
        proxy_pass http://nginx:5000;   # backend LB service name is "nginx" in your backend compose
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 1000;
    }

    location /future-api/ {
        proxy_pass http://nginx:7000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 1000;
    }

    location /service-api/ {
        proxy_pass http://nginx:9000;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_read_timeout 3600;
    }

    # --- Angular SPA ---
    location / {
        try_files $uri $uri/ /index.html;
    }
}

  <div class="stock-list-container">

    <div class="container-fluid py-3">
      <div class="row mb-3">
        <div class="col-md-6">
          <div class="stock-filter stock-filter--premium d-flex">
            <input type="text" class="form-control stock-filter__control stock-filter__input me-2"
              placeholder="Search stock by name..." [(ngModel)]="searchText" (input)="onSearchInput(searchText)" />

            <select class="form-select stock-filter__control stock-filter__select" [(ngModel)]="selectedIndexIds"
              name="table_name" #indexid (change)="onIndexChange(indexid.value)">
              <option value="">-- Select index --</option>
              <option *ngFor="let index of indexList" [value]="index.index_id">
                {{ index.index_name }}
              </option>
            </select>
          </div>
          <!-- <div class="stock-filter d-flex">
                <input type="text" class="form-control me-2" placeholder="Search stock by name..."
                  [(ngModel)]="searchText" (input)="onSearchInput(searchText)" />
                <select class="form-select" [(ngModel)]="selectedIndexIds" name="table_name" #indexid
                  (change)="onIndexChange(indexid.value)">
                  <option value="">-- Select index --</option>
                  <option *ngFor="let index of indexList" [value]="index.index_id">

                    {{ index.index_name }}
                  </option>
                </select>
              </div> -->
        </div>
        <div class="col-md-6 d-flex justify-content-end">
          <!-- Left: Pagination Controls -->
          <div class="pagination-container d-flex align-items-center gap-1 flex-wrap">
            <button class="btn btn-sm nav-btn" (click)="goToPreviousPage()" [disabled]="getCurrentPage() === 1">
              ‹ Prev
            </button>

            <ng-container *ngFor="let page of getPageNumbers()">
              <button class="btn btn-sm page-btn" [class.active]="page === getCurrentPage()" (click)="goToPage(page)">
                {{ page }}
              </button>
            </ng-container>

            <button class="btn btn-sm nav-btn" (click)="goToNextPage()"
              [disabled]="getCurrentPage() >= getTotalPages()">
              Next ›
            </button>

            <select style="height:38px;" class="form-select form-select-sm w-auto d-inline-block" [(ngModel)]="pageSize"
              (change)="onPageSizeChange()">
              <option *ngFor="let size of pageSizeOptions" [value]="size">{{ size }} per page</option>
            </select>

          </div>
        </div>
      </div>

      <div class="stock-table-wrap">
        <table class="stock-table premium-stock-table">
          <thead>
            <tr>
              <th>SL.</th>
              <th (click)="sortData('stock_tick')" class="sortable-col">
                Stock
                <span *ngIf="sortColumn === 'stock_tick'">{{ sortDirection === 'asc' ? '↑' : '↓' }}</span>
              </th>

              <th (click)="sortData('is_active')" class="sortable-col">
                Status
                <span *ngIf="sortColumn === 'is_active'">{{ sortDirection === 'asc' ? '↑' : '↓' }}</span>
              </th>

              <th>Exclude Trading</th>
            </tr>
          </thead>

          <tbody>
            <tr *ngFor="let item of filteredListData; let i = index">
              <td data-label="SL.">
                <span class="sl-badge">{{ i + 1 }}</span>
              </td>

              <td data-label="Stock" class="stock-cell" id="stockCell" #stockCell [attr.data-stock]="item.stock_tick"
                [ngStyle]="isHighlightedforSystmAlrt(item.stock_tick) ? { 'background-color': '#fff7bf' } : {}">
                <span class="stock-name">{{ item.stock_tick }}</span>
              </td>

              <td data-label="Status">
                <span class="status-pill"
                  [ngClass]="item.is_active == '1' || item.is_active == 1 ? 'status-pill--active' : 'status-pill--inactive'">
                  {{ item.is_active == '1' || item.is_active == 1 ? 'Active' : 'Inactive' }}
                </span>
              </td>

              <td data-label="Exclude Trading">
                <label class="switch premium-switch">
                  <input type="checkbox" [checked]="item.is_proc == 1" (change)="toggleProc(item!.id, $event)">
                  <span class="slider"></span>
                </label>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
